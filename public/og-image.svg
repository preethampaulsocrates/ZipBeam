<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative dots -->
  <circle cx="1080" cy="90" r="5" fill="#A855F7" opacity="0.4"/>
  <circle cx="1130" cy="140" r="3" fill="#06B6D4" opacity="0.5"/>
  <circle cx="90" cy="540" r="4" fill="#4F46E5" opacity="0.3"/>
  <circle cx="150" cy="500" r="3" fill="#7C3AED" opacity="0.4"/>

  <!-- Logo -->
  <g transform="translate(110, 110)">
    <rect width="84" height="84" rx="22" fill="url(#logo-grad)"/>
    <path d="M47 22L25 50h19L40 78l34-36h-19l12-20z" fill="white"/>
  </g>

  <text x="210" y="172" font-family="Arial, sans-serif" font-size="56" font-weight="800" fill="#0F172A">ZipBeam</text>

  <text x="110" y="290" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#0F172A">Send files from your</text>
  <text x="110" y="356" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="url(#text-grad)">phone to PC or laptop</text>

  <text x="110" y="412" font-family="Arial, sans-serif" font-size="26" fill="#64748B">No app &#183; No cable &#183; No signup &#183; 100% Free</text>

  <!-- QR code mockup -->
  <g transform="translate(900, 280)">
    <rect width="190" height="190" rx="16" fill="white" stroke="#CBD5E1" stroke-width="2"/>
    <g fill="#0F172A">
      <rect x="20" y="20" width="40" height="40"/>
      <rect x="130" y="20" width="40" height="40"/>
      <rect x="20" y="130" width="40" height="40"/>
      <rect x="75" y="75" width="40" height="40"/>
      <rect x="130" y="130" width="15" height="15"/>
      <rect x="155" y="130" width="15" height="15"/>
      <rect x="130" y="155" width="15" height="15"/>
      <rect x="75" y="30" width="15" height="15"/>
      <rect x="30" y="75" width="15" height="15"/>
    </g>
  </g>

  <!-- India badge -->
  <g transform="translate(110, 460)">
    <rect width="170" height="44" rx="22" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="20" y="29" font-family="Arial, sans-serif" font-size="22">&#127470;&#127475;</text>
    <text x="55" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#475569">Made in India</text>
  </g>
</svg>
