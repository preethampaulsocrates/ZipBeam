<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — SendThem</title>
  <meta name="robots" content="index, follow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .contact-wrap { max-width: 560px; margin: 0 auto; padding: 60px 24px 100px; text-align: center; }
    .contact-wrap h1 { font-family: var(--font-head); font-size: 32px; font-weight: 800; margin-bottom: 12px; }
    .contact-wrap p.sub { color: var(--gray-400); font-size: 15px; margin-bottom: 36px; line-height: 1.6; }
    .contact-card {
      background: linear-gradient(160deg, rgba(22,26,54,0.9), rgba(13,15,38,0.85));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(168,85,247,0.18);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      box-shadow: var(--shadow-md);
    }
    .contact-email {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 12px;
      background: rgba(34,211,238,0.06);
      border: 1px solid rgba(34,211,238,0.25);
      transition: all 0.2s;
    }
    .contact-email:hover { border-color: var(--cyan); background: rgba(34,211,238,0.1); }
    .contact-note { margin-top: 24px; color: var(--gray-400); font-size: 13px; line-height: 1.6; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--gray-400); font-size: 13px; text-decoration: none; margin-bottom: 24px; }
    .back-link:hover { color: var(--cyan); }
  </style>
</head>
<body>
<div class="app-shell">
  <nav class="navbar">
    <a href="/" class="logo">
      <svg width="28" height="28" viewBox="0 0 34 34" fill="none"><rect width="34" height="34" rx="9" fill="url(#cg)"/><path d="M19 6L10 18h7.5L14 28 27 14h-7.5L19 6z" fill="white"/><defs><linearGradient id="cg" x1="0" y1="0" x2="34" y2="34"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#A855F7"/></linearGradient></defs></svg>
      <span class="logo-text">SendThem</span>
    </a>
  </nav>

  <div class="contact-wrap">
    <a href="/" class="back-link" style="justify-content:center">← Back to SendThem</a>
    <h1>Get in Touch</h1>
    <p class="sub">Questions, feedback, bug reports, or business inquiries — reach out anytime.</p>

    <div class="contact-card">
      <a class="contact-email" href="mailto:preethampaulsocrates@hotmail.com">
        ✉️ preethampaulsocrates@hotmail.com
      </a>
      <p class="contact-note">We typically respond within 24–48 hours.</p>
    </div>
  </div>
</div>
</body>
</html>
